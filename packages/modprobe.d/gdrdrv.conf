# Run on every modprobe of gdrdrv so proprietary builds (no device_create)
# get a fresh /dev/gdrdrv after boot and across unload/reload. Open-source
# builds that already have a udev-created node are left alone if the major matches.
install gdrdrv /sbin/modprobe --ignore-install gdrdrv $CMDLINE_OPTS && /usr/libexec/gdrcopy/gdrdrv_devnode.sh create
remove gdrdrv /sbin/modprobe -r --ignore-remove gdrdrv && /usr/libexec/gdrcopy/gdrdrv_devnode.sh remove
